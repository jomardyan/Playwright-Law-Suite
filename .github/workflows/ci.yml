name: CI

# Builds and tests UniVerscan itself. This is the check that gates pull
# requests; universcan.yml scans a deployed site and only runs where a
# target has been configured.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Keyed on the lockfile, because the lockfile is what pins the
      # Playwright version and therefore the browser revision.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # The end-to-end suites launch a real browser against a local fixture
      # server, so they need one installed to be worth running at all.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # UNIVERSCAN_REQUIRE_CHROMIUM turns a missing browser into a failed
      # suite rather than a quietly reduced one.
      - name: Test
        run: npm test
        env:
          UNIVERSCAN_REQUIRE_CHROMIUM: "1"

      # Exercises the published entrypoint from the build output, which the
      # unit tests reach through src/ and so would not catch.
      - name: Smoke-check the built CLI
        run: |
          node dist/cli.js --version
          node dist/cli.js packs
          node dist/cli.js doctor

      - name: Check the package contents
        run: npm pack --dry-run

      # action.yml installs a pinned universcan version from npm. If that pin
      # falls behind package.json, the published action runs an older scanner
      # than the release it ships with. The release workflow enforces this too;
      # checking it here means the drift is caught in the pull request that
      # causes it.
      - name: Check action.yml pins the current version
        run: |
          set -euo pipefail
          pkg="$(node -p "require('./package.json').version")"
          declared="$(node -e "
            const fs = require('node:fs');
            const m = fs.readFileSync('action.yml', 'utf8').match(/version:[\s\S]*?default:\s*\"([^\"]+)\"/);
            process.stdout.write(m ? m[1] : '');
          ")"
          if [ "$declared" != "$pkg" ]; then
            echo "::error::action.yml pins universcan@$declared but package.json is $pkg." >&2
            exit 1
          fi
          echo "action.yml pins $declared, matching package.json."
