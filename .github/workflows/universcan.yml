name: UniVerscan Compliance Scan

# Example CI integration, and the monitoring scan for this repository's own
# staging deployment. Critical/high findings fail the build; manual review
# items are surfaced as warnings via the JUnit "skipped" summary, the job
# summary, and the uploaded HTML/JSON/SARIF reports, but do not block the
# pipeline on their own.
#
# The scan needs a deployed site to point at, which is read from the
# STAGING_URL repository variable. Every job below is gated on it, so where
# no target has been configured the workflow reports nothing rather than
# failing on an empty --url. CI for the scanner's own code is in ci.yml.

on:
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly production monitoring scan
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: universcan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A configured target is a repository-level condition, not a per-step one,
  # so it is resolved once here and the scan jobs depend on the answer.
  target:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
        run: |
          if [ -n "$STAGING_URL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "No STAGING_URL repository variable is set, so there is no deployment to scan." \
              >> "$GITHUB_STEP_SUMMARY"
            echo "Set it under Settings > Secrets and variables > Actions > Variables to enable this scan." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

  compliance-scan:
    needs: target
    if: needs.target.outputs.configured == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # required to upload the SARIF report
      checks: write # required to publish the JUnit check run
    env:
      # A pull request from a fork and one opened by Dependabot both run with
      # a read-only token. Dependabot pushes its branch to this repository,
      # so the fork check alone does not cover it.
      TOKEN_CAN_WRITE: ${{ github.event.pull_request.head.repo.fork != true && github.actor != 'dependabot[bot]' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run UniVerscan against the staging deployment
        run: |
          node dist/cli.js scan \
            --url "${{ vars.STAGING_URL }}" \
            --config config/profiles/eu-ecommerce.json \
            --format json,html,junit,sarif,markdown \
            --out ./universcan-report \
            --fail-on critical,high

      # Each reporting step below runs even when the scan failed the build,
      # which is the case they exist for, but is skipped when the scan
      # produced no file at all: reporting a missing report as a second
      # failure buries the real one.
      - name: Add findings to the job summary
        if: always() && hashFiles('universcan-report/report.md') != ''
        run: cat universcan-report/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload compliance report
        if: always() && hashFiles('universcan-report/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: universcan-report
          path: universcan-report/

      # Surfaces findings as code-scanning alerts. Suppressed findings are
      # uploaded too, carrying the documented reason, so an accepted risk
      # stays visible instead of disappearing from the security tab.
      #
      # The two steps that need a writable token are skipped where the
      # token is read-only, rather than left to fail with a 403. The report
      # artifact above still carries the findings in that case.
      - name: Upload SARIF to code scanning
        if: always() && env.TOKEN_CAN_WRITE == 'true' && hashFiles('universcan-report/report.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: universcan-report/report.sarif
          category: universcan

      - name: Publish JUnit summary
        if: always() && env.TOKEN_CAN_WRITE == 'true' && hashFiles('universcan-report/report.junit.xml') != ''
        uses: dorny/test-reporter@v3
        with:
          name: UniVerscan Findings
          path: universcan-report/report.junit.xml
          reporter: java-junit
          fail-on-error: false

  # Verifies a remediation round: scans the staging deployment and compares
  # the result against the last report published from the default branch,
  # failing only on findings this change introduced.
  regression-diff:
    needs: target
    if: github.event_name == 'pull_request' && needs.target.outputs.configured == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build

      - name: Download the baseline report from the default branch
        id: baseline
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v24
        with:
          workflow: universcan.yml
          branch: ${{ github.event.repository.default_branch }}
          name: universcan-report
          path: ./universcan-baseline

      # There is nothing to compare against until the default branch has
      # published a report, so the first run on a fresh repository reports
      # that rather than diffing against an absent baseline.
      - name: Scan and compare against the baseline
        if: steps.baseline.outcome == 'success' && hashFiles('universcan-baseline/report.json') != ''
        run: |
          node dist/cli.js scan \
            --url "${{ vars.STAGING_URL }}" \
            --config config/profiles/eu-ecommerce.json \
            --format json,markdown \
            --out ./universcan-report \
            --baseline ./universcan-baseline/report.json \
            --fail-on-new \
            --fail-on critical,high | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Report a missing baseline
        if: steps.baseline.outcome != 'success' || hashFiles('universcan-baseline/report.json') == ''
        run: |
          echo "No baseline report was found on ${{ github.event.repository.default_branch }}, so there is nothing to diff against yet." \
            >> "$GITHUB_STEP_SUMMARY"
          echo "The first scan to complete on the default branch becomes the baseline for later pull requests." \
            >> "$GITHUB_STEP_SUMMARY"
